# Beispiel fuer einen vorgelagerten nginx mit TLS.
# Wichtig sind die drei Upgrade-Header: ohne sie bleibt die Live-Ansicht leer,
# weil die WebSocket-Verbindung nicht zustande kommt.
#
# Bei dieser Variante zusaetzlich in der config.yaml setzen:
#   server.secure_cookies: true
#   server.behind_proxy:   true

server {
    listen 443 ssl;
    http2 on;
    server_name ansible.example.com;

    ssl_certificate     /etc/ssl/certs/ansible.example.com.pem;
    ssl_certificate_key /etc/ssl/private/ansible.example.com.key;

    # Hochgeladene Dateien duerfen so gross sein wie files.max_upload_bytes.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Playbooks duerfen lange laufen, ohne dass die Verbindung abreisst.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
    }
}
