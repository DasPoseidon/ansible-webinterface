; supervisord-Abschnitt fuer das Ansible-Webinterface.
; Passend fuer Container ohne systemd.
;
; Installation:
;   cp <installationsverzeichnis>/deploy/supervisord-ansible-web.conf \
;      /etc/supervisor/conf.d/ansible-web.conf
;   supervisorctl reread && supervisorctl update
;
; Liegt die Anwendung nicht unter /root/ansible-web, ist genau EINE Zeile
; anzupassen: command. Das Startskript leitet daraus alles Weitere ab.

[program:ansible-web]
command=/root/ansible-web/bin/ansible-web-serve
user=root
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/ansible-web.log
stderr_logfile=/var/log/ansible-web.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
